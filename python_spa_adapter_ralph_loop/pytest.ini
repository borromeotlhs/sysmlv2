[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts =
    --verbose
    --tb=short
    --strict-markers
    --color=yes
    -ra

# Coverage settings
[coverage:run]
source = spa,scripts,lib
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Test markers
markers =
    parser: Parser tests
    validation: Validation tests
    integration: Integration tests
    slow: Slow-running tests
    requires_server: Tests that require a running server

# Timeout settings
timeout = 300
timeout_method = thread
